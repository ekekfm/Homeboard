name: 뉴스 갱신 (아침·점심·저녁)
on:
  schedule:
    - cron: "7 22 * * *"   # 아침: 한국 시간 오전 7시 7분
    - cron: "37 23 * * *"  # 아침 예비: 오전 8시 37분 (위 실행이 빠졌을 때만 채움)
    - cron: "7 3 * * *"    # 점심: 낮 12시 7분
    - cron: "7 4 * * *"    # 점심 예비: 오후 1시 7분
    - cron: "7 9 * * *"    # 저녁: 오후 6시 7분
    - cron: "7 10 * * *"   # 저녁 예비: 오후 7시 7분
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: briefing
  cancel-in-progress: false
jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/briefing.mjs
      - name: 변경이 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefing.json
          if ! git diff --cached --quiet; then
            git commit -m "뉴스 갱신"
            git pull --rebase origin main
            git push
          fi
